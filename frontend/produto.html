<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - AlimConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>body { font-family: 'Manrope', sans-serif; }</style>
</head>
<body class="bg-[#FAF9F6]">
    <header class="flex items-center justify-between px-10 py-4 bg-white border-b sticky top-0 z-50">
        <a href="index.html" class="text-[#5D4037] font-bold">← Voltar para o Início</a>
        <a href="favoritos.html" class="relative text-slate-600 hover:text-red-500 transition-colors">
            <span class="material-symbols-outlined text-3xl">favorite</span>
            <span id="contador-favoritos" class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full size-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <div class="max-w-6xl mx-auto p-10">
        <div id="conteudo-produto" class="grid grid-cols-1 md:grid-cols-2 gap-10 mt-10 bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex gap-4">
                <div class="flex flex-col gap-2 w-20">
                    <img id="thumb-1" src="" onclick="trocarImagem(this.src)" 
                         class="w-full h-20 object-contain p-1 bg-slate-50 rounded-lg border-2 border-[#FFCC80] cursor-pointer transition">
                    <img id="thumb-2" src="" onclick="trocarImagem(this.src)" 
                         class="w-full h-20 object-contain p-1 bg-slate-50 rounded-lg border-2 border-transparent hover:border-[#FFCC80] cursor-pointer transition">
                </div>
                <div class="flex-1 h-96 bg-slate-50 rounded-2xl flex items-center justify-center overflow-hidden border border-slate-100">
                    <img id="img-detalhe" src="" class="max-h-[90%] object-contain hover:scale-110 transition duration-500">
                </div>
            </div>

            <div class="flex flex-col justify-center">
                <span class="text-[#FFCC80] font-bold uppercase tracking-widest text-sm">Produção Nacional</span>
                <h1 id="nome-produto" class="text-4xl font-black text-[#5D4037] mt-2">Carregando...</h1>
                
                <p id="produto-descricao" class="text-sm text-slate-500 mt-4 leading-relaxed">Carregando informações do produto...</p>

                <div class="mt-6 p-4 bg-[#F5F5DC]/30 rounded-xl w-fit">
                    <span class="text-3xl font-bold text-slate-900">R$ <span id="preco-produto">0,00</span></span>
                </div>

                <button onclick="toggleFavorito()" id="btn-fav" class="mt-8 w-full flex items-center justify-center gap-2 font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95 border-2 border-red-500 bg-red-500 text-white">
                    <span id="fav-icon" class="material-symbols-outlined">favorite</span>
                    <span id="fav-text">Favoritar Produto</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Catálogo de produtos fixos do seu código (Chaves em texto)
        const produtosFixos = {
            'amendoim': { nome: 'Amendoim Pimenta e Limão', foto: 'assets/amendoim.png', foto2: 'assets/amendoimpimenta.png', preco: 8.50, descricao: 'Delicioso amendoim torrado com uma cobertura crocante sabor pimenta e limão.' },
            'batata': { nome: 'Batata Chips Artesanal', foto: 'assets/batata.png', foto2: 'assets/batataprato.png', preco: 12.00, descricao: 'Batatas selecionadas, cortadas fininhas e fritas artesanalmente.' },
            'biscoito': { nome: 'Biscoitos de Polvilho', foto: 'assets/biscoito.png', foto2: 'assets/biscoitonoprato.png', preco: 6.90, descricao: 'Biscoito de polvilho azedo tradicional, leve e crocante.' },
            'castanha': { nome: 'Castanha de Caju Premium', foto: 'assets/castanhas.png', foto2: 'assets/castanhasnoprato.png', preco: 15.00, descricao: 'Castanhas de caju premium torradas e levemente salgadas.' },
            'mix-castanhas': { nome: 'Mix de Castanhas Mistas', foto: 'assets/castanhasmistas.png', foto2: 'assets/castanhaspremiumnoprato.png', preco: 18.50, descricao: 'Um combinado perfeito de castanhas, nozes e amêndoas.' },
            'milho': { nome: 'Snacks de Milho Torrado', foto: 'assets/milho.png', foto2: 'assets/milhoprato.png', preco: 7.50, descricao: 'Milho torrado e salgado sabor mostarda e mel.' },
            'pretzel': { nome: 'Pretzel Salgado Tradicional', foto: 'assets/pretzel.png', foto2: 'assets/pretzelprato1.png', preco: 9.00, descricao: 'Pretzel assado tradicional salpicado com sal grosso.' }
        };
    
        // Guarda os dados do produto atual que está aberto na tela
        let produtoAtual = null;
    
        function trocarImagem(src) {
            const imgDetalhe = document.getElementById('img-detalhe');
            if (imgDetalhe) imgDetalhe.src = src;
        }
    
        async function carregarDetalhesProduto() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            const itemParam = params.get('item');
            const valorParametro = idParam || itemParam;
    
            const tituloEl = document.getElementById('nome-produto');
            const precoEl = document.getElementById('preco-produto');
            const descEl = document.getElementById('produto-descricao');
            const imgEl = document.getElementById('img-detalhe');
            const thumb1 = document.getElementById('thumb-1');
            const thumb2 = document.getElementById('thumb-2');
    
            if (!valorParametro) {
                if (descEl) descEl.textContent = "Nenhum produto foi selecionado.";
                return;
            }
    
            // CASO 1: SE FOR NÚMERO (Do Banco de Dados)
            if (idParam || !isNaN(valorParametro)) {
                const idBuscar = idParam || valorParametro;
                try {
                    const response = await fetch(`http://localhost:3000/api/products/${idBuscar}`);
                    if (response.ok) {
                        const p = await response.json();
                        
                        // Monta o objeto padronizado para os favoritos
                        produtoAtual = {
                            id: p.id,
                            nome: p.name || p.nome || 'Produto Sem Nome',
                            preco: parseFloat(p.price || p.preco || 0),
                            foto: `http://localhost:3000/uploads/${p.img || 'placeholder.png'}`
                        };
    
                        if (tituloEl) tituloEl.textContent = produtoAtual.nome;
                        if (precoEl) precoEl.textContent = produtoAtual.preco.toFixed(2);
                        if (descEl) descEl.textContent = p.description || p.descricao || 'Sem descrição disponível para este snack.';
                        
                        if (imgEl) {
                            imgEl.src = produtoAtual.foto;
                            if (thumb1) thumb1.src = produtoAtual.foto;
                            if (thumb2) thumb2.src = produtoAtual.foto;
                        }
                        
                        atualizarInterfaceFavoritos();
                        return; // Para o fluxo aqui se encontrou no banco
                    }
                } catch (error) {
                    console.error("Erro ao conectar com o banco de dados:", error);
                }
            }
    
            // CASO 2: SE FOR TEXTO (Do Catálogo Fixo Antigo)
            if (produtosFixos[valorParametro]) {
                const p = produtosFixos[valorParametro];
                
                produtoAtual = {
                    id: valorParametro,
                    nome: p.nome,
                    preco: parseFloat(p.preco),
                    foto: p.foto
                };
    
                if (tituloEl) tituloEl.textContent = p.nome;
                if (precoEl) precoEl.textContent = p.preco.toFixed(2);
                if (descEl) descEl.textContent = p.descricao;
                if (imgEl) imgEl.src = p.foto;
                if (thumb1) thumb1.src = p.foto;
                if (thumb2) thumb2.src = p.foto2 || p.foto;
                
                atualizarInterfaceFavoritos();
            } else {
                if (descEl) descEl.textContent = "Produto não encontrado ou indisponível no catálogo atual.";
            }
        }
    
        // --- SISTEMA INTEGRAÇÃO DE FAVORITOS ---
        function obterFavoritos() {
            return JSON.parse(localStorage.getItem('alim_favoritos')) || [];
        }
    
        function atualizarInterfaceFavoritos() {
            if (!produtoAtual) return;
            
            const favoritos = obterFavoritos();
            const jaFavoritado = favoritos.some(item => item.id == produtoAtual.id);
            
            const btnFav = document.getElementById('btn-fav');
            const favText = document.getElementById('fav-text');
            const favIcon = document.getElementById('fav-icon');
            const contador = document.getElementById('contador-favoritos');
    
            if (contador) contador.textContent = favoritos.length;
    
            if (jaFavoritado) {
                if (btnFav) btnFav.className = "mt-8 w-full flex items-center justify-center gap-2 font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95 border-2 border-amber-500 bg-amber-500 text-white";
                if (favText) favText.textContent = "Remover dos Favoritos";
                if (favIcon) favIcon.textContent = "heart_broken";
            } else {
                if (btnFav) btnFav.className = "mt-8 w-full flex items-center justify-center gap-2 font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95 border-2 border-red-500 bg-red-500 text-white";
                if (favText) favText.textContent = "Favoritar Produto";
                if (favIcon) favIcon.textContent = "favorite";
            }
        }
    
        function toggleFavorito() {
            if (!produtoAtual) return;
    
            let favoritos = obterFavoritos();
            const index = favoritos.findIndex(item => item.id == produtoAtual.id);
    
            if (index > -1) {
                favoritos.splice(index, 1);
                alert(`"${produtoAtual.nome}" foi removido dos seus favoritos!`);
            } else {
                favoritos.push(produtoAtual);
                alert(`"${produtoAtual.nome}" adicionado aos favoritos com sucesso!`);
            }
    
            localStorage.setItem('alim_favoritos', JSON.stringify(favoritos));
            atualizarInterfaceFavoritos();
        }
    
        window.onload = () => {
            carregarDetalhesProduto();
            const contador = document.getElementById('contador-favoritos');
            if (contador) contador.textContent = obterFavoritos().length;
        };
    </script>
</body>
</html>
